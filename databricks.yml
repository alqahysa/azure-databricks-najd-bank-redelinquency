bundle:
  name: banking-end-to-end-project

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://<workspace-host>

  prod:
    mode: production
    workspace:
      host: https://<workspace-host>
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}