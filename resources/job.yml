resources:
  jobs:
    banking_end_to_end_job:
      name: banking_end_to_end_job
      schedule:
        quartz_cron_expression: 50 0 6 * * ?
        timezone_id: Asia/Riyadh
        pause_status: UNPAUSED
      tasks:
        - task_key: bronze_branches
          notebook_task:
            notebook_path: ../bronze/branches_raw_data_ingestion.py
        - task_key: bronze_customers
          notebook_task:
            notebook_path: ../bronze/customers_raw_data_ingestion.py
        - task_key: bronze_products
          notebook_task:
            notebook_path: ../bronze/products_raw_data_ingestion.py
            source: WORKSPACE
        - task_key: bronze_repayments
          notebook_task:
            notebook_path: ../bronze/repayments_raw_data_ingestion.py
        - task_key: silver_dim_branch
          depends_on:
            - task_key: bronze_branches
          notebook_task:
            notebook_path: ../silver/dim_branch_ingestion.py
        - task_key: silver_dim_customer
          depends_on:
            - task_key: bronze_customers
          notebook_task:
            notebook_path: ../silver/dim_customer_ingestion.py
        - task_key: silver_dim_product
          depends_on:
            - task_key: bronze_products
          notebook_task:
            notebook_path: ../silver/dim_product_ingestion.py
        - task_key: silver_fact_repayment
          depends_on:
            - task_key: bronze_repayments
            - task_key: silver_dim_branch
            - task_key: silver_dim_customer
            - task_key: silver_dim_product
          notebook_task:
            notebook_path: ../silver/fact_repayment_ingestion.py
        - task_key: gold_redelinquency
          depends_on:
            - task_key: silver_fact_repayment
          notebook_task:
            notebook_path: ../gold/redelinquency_analysis.py
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
